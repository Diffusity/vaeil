[project]
name = "vaeil"
version = "0.1.0"
description = "Vaeil — values-based matching with AI-assisted safety"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.2", "uvicorn==0.54.0", "psycopg[binary]==3.3.8"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.1", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
