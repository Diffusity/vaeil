name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root deployment image
        run: docker build -t vaeil-t4 .
      - name: Smoke test image under database failure
        run: |
          docker run -d --name vaeil-t4 --memory 512m --cpus 0.1 -e DATABASE_URL=invalid-test-configuration -p 127.0.0.1:8766:10000 vaeil-t4
          python3 scripts/smoke_deployment.py http://127.0.0.1:8766 --expect-database-unavailable
          test "$(docker exec vaeil-t4 id -u)" != "0"
          docker stats --no-stream --format '{{.MemUsage}}' vaeil-t4
      - name: Stop owned test container
        if: always()
        run: docker rm -f vaeil-t4 || true
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Lint, validate assumptions, and test
        run: .venv\Scripts\python.exe scripts/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and typecheck frontend, then build
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
      - name: Install browser and test same-origin demo
        working-directory: frontend
        run: |
          npx playwright install chromium
          npm test
