name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Lint, validate assumptions, and test
        run: .venv\Scripts\python.exe scripts/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and typecheck frontend, then build
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
      - name: Install browser and test same-origin demo
        working-directory: frontend
        run: |
          npx playwright install chromium
          npm test
