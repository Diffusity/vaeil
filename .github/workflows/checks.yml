name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Run the same contract against SQLite and disposable PostgreSQL
        env:
          VAEIL_TEST_POSTGRES_URL: postgresql://postgres:contract-test-only@127.0.0.1:5432/postgres
        run: python -m pytest tests/test_repository_contract.py -q
      - name: Kill persistence mutations on both databases
        env:
          VAEIL_TEST_POSTGRES_URL: postgresql://postgres:contract-test-only@127.0.0.1:5432/postgres
        run: python scripts/mutate_persistence.py
      - name: Verify restored contracts and privacy boundary
        env:
          VAEIL_TEST_POSTGRES_URL: postgresql://postgres:contract-test-only@127.0.0.1:5432/postgres
        run: python -m pytest tests/test_repository_contract.py tests/test_private_unwrap_boundary.py tests/test_domain_purity.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-mutations
          path: docs/audit/t5-mutations.json
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root deployment image
        run: docker build -t vaeil-t4 .
      - name: Smoke test image under database failure
        run: |
          docker run -d --name vaeil-t4 --memory 512m --cpus 0.1 -e DATABASE_URL=invalid-test-configuration -p 127.0.0.1:8766:10000 vaeil-t4
          python3 scripts/smoke_deployment.py http://127.0.0.1:8766 --expect-database-unavailable
          test "$(docker exec vaeil-t4 id -u)" != "0"
          docker stats --no-stream --format '{{.MemUsage}}' vaeil-t4
      - name: Stop owned test container
        if: always()
        run: docker rm -f vaeil-t4 || true
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Lint, validate assumptions, and test
        run: .venv\Scripts\python.exe scripts/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and typecheck frontend, then build
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
      - name: Install browser and test same-origin demo
        working-directory: frontend
        run: |
          npx playwright install chromium
          npm test
